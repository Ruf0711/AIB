<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis · Product Reviews</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #2d3748;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .file-section {
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px dashed #667eea;
        }
        .file-label {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .file-label:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        #fileInput {
            display: none;
        }
        #fileName {
            margin-left: 15px;
            color: #4a5568;
            font-size: 14px;
        }
        .token-section {
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .token-section label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
        }
        #hfToken {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        #hfToken:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.2);
        }
        .btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }
        .review-card {
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
            margin: 20px 0;
        }
        .review-title {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        #reviewText {
            font-size: 16px;
            line-height: 1.6;
            color: #2d3748;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .sentiment-card {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            padding: 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }
        #sentimentIcon {
            font-size: 48px;
            width: 60px;
            text-align: center;
        }
        #sentimentLabel {
            font-size: 32px;
            font-weight: bold;
            color: #2d3748;
        }
        .error-box {
            background: #fff5f5;
            border: 1px solid #fc8181;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            color: #c53030;
        }
        .error-box.show {
            display: flex;
        }
        .stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <i class="fa-solid fa-robot"></i>
            Review Sentiment Analysis
        </h1>

        <!-- SECTION: File Upload -->
        <div class="file-section">
            <label for="fileInput" class="file-label">
                <i class="fa-solid fa-upload"></i>
                Choose reviews_test.tsv file
            </label>
            <input type="file" id="fileInput" accept=".tsv,.txt,.csv">
            <span id="fileName">No file selected</span>
            <p style="margin-top: 12px; color: #718096; font-size: 13px;">
                <i class="fa-solid fa-info-circle"></i>
                Select your reviews_test.tsv file from your computer
            </p>
        </div>

        <!-- SECTION: API Token -->
        <div class="token-section">
            <label>
                <i class="fa-solid fa-key"></i>
                Hugging Face API Token (optional)
            </label>
            <input type="text" id="hfToken" placeholder="hf_... or leave empty for anonymous">
        </div>

        <!-- BUTTON: Analyze -->
        <button class="btn" id="analyzeBtn" disabled>
            <i class="fa-solid fa-shuffle"></i>
            Analyze Random Review
        </button>

        <!-- SECTION: Review Display -->
        <div class="review-card">
            <div class="review-title">
                <i class="fa-regular fa-note-sticky"></i>
                REVIEW TEXT
            </div>
            <div id="reviewText">Select a TSV file and click analyze...</div>
        </div>

        <!-- SECTION: Sentiment Result -->
        <div class="sentiment-card">
            <span id="sentimentIcon">
                <i class="fa-regular fa-face-smile"></i>
            </span>
            <span id="sentimentLabel">---</span>
        </div>

        <!-- SECTION: Errors -->
        <div id="errorBox" class="error-box">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorMessage"></span>
        </div>

        <!-- SECTION: Stats -->
        <div class="stats" id="stats">
            Waiting for file...
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
